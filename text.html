<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Text Editor</title>
  <link rel="icon" type="image/png" href="./newtab/icons/note.png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="text/javascript" src="/JavaScriptSpellCheck/include.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: #0f2a50; font-family: sans-serif; }
    #myTextArea {
      background-color: #123563; color: white; font-size: 20px; width: 100%;
      flex: 1 1 auto; min-height: 220px; padding: 10px; box-sizing: border-box; border: none; outline: none;
    }
    table { width: 100%; background: #0f2a50; color: #e6eaf2; }
    td { vertical-align: middle; }
    input[type="text"], select {
      width: 100%; box-sizing: border-box; height: 2.14285714em; padding: 4px 10px; margin: 3px;
      border: 1px solid #2b3f66; border-radius: 3px; background: #0c2244; color: #e6eaf2;
    }
    button {
      width: 160px; box-sizing: border-box; transition: background-color .1s ease-out; border-radius: 3.01px;
      cursor: pointer; font-size: 14px; background-color: #E2E4E9; border: 1px solid transparent;
      color: #344563; text-decoration: none; display: inline-block; height: 2.14285714em; line-height: 1.42857143em;
      margin: 3px; padding: 4px 10px; white-space: nowrap;
    }
    button:hover { background-color: #D5D9E0; }
    .right { text-align: right; }
    .nowrap { white-space: nowrap; }
    #status { color: #9fb3d9; font-size: 12px; margin: 4px 8px 8px; min-height: 1em; }
  </style>
</head>

<body>
  <textarea name="myTextArea" id="myTextArea" placeholder="Start typing..."></textarea>

  <div id="status"></div>

  <table>
    <tr>
      <td class="nowrap">Filename to Save As:</td>
      <td><input id="inputFileNameToSaveAs" type="text" placeholder="notes.txt" /></td>
      <td class="right"><button id="btnSaveFile">Save Text to File</button></td>
    </tr>
    <tr>
      <td class="nowrap">Select a File to Load:</td>
      <td><input type="file" id="fileToLoad" /></td>
      <td class="right"><button id="btnLoadFile">Load Selected File</button></td>
    </tr>
    <tr>
      <td class="nowrap">Enter HTML Code to Preview:</td>
      <td></td>
      <td class="right"><button id="btnPreview">Preview HTML</button></td>
    </tr>
    <tr>
      <td class="nowrap">Snapshots (local):</td>
      <td>
        <select id="versionSelect" title="Choose a previous version to restore"></select>
      </td>
      <td class="right">
        <button id="btnRestore">Restore Selected</button>
        <button id="btnSnapshot">Save Snapshot</button>
      </td>
    </tr>
  </table>

<script>
/* =========================================
   Global version store + per-tab autosaving
   ========================================= */

// ---- Tab identity (persists across reloads in same tab) ----
function getTabId() {
  try {
    let id = sessionStorage.getItem('notepad.tabId');
    if (id) return id;
    id = (window.name && window.name.startsWith('notepad-'))
      ? window.name
      : `notepad-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
    sessionStorage.setItem('notepad.tabId', id);
    if (!window.name) window.name = id;
    return id;
  } catch {
    if (!window.name) window.name = `notepad-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
    return window.name;
  }
}
const TAB_ID = getTabId();

// ---- Keys (shared across tabs for the same site/origin) ----
const CURRENT_KEY  = 'notepad.current';      // last working text (global)
const VERSIONS_KEY = 'notepad.versions';     // array of snapshots (global)

// ---- Settings ----
const MAX_VERSIONS = 200;                    // total versions kept
const AUTOSAVE_IDLE_MS = 2000;               // 2s pause before autosave
const DROPDOWN_PREVIEW_LIMIT = 100;          // first 100 chars in dropdown

// ---- DOM helpers ----
const $text   = () => document.getElementById('myTextArea');
const $select = () => document.getElementById('versionSelect');
const $status = () => document.getElementById('status');

// ---- Utilities ----
function fmtDateMMDDYYYY(date) {
  const mm = String(date.getMonth() + 1).padStart(2, '0');
  const dd = String(date.getDate()).padStart(2, '0');
  const yyyy = date.getFullYear();
  return `${mm}/${dd}/${yyyy}`;
}
function previewN(txt, n = DROPDOWN_PREVIEW_LIMIT) {
  const t = (txt || '').replace(/\s+/g, ' ').trim();
  return t.length <= n ? t : (t.slice(0, n) + '…');
}
function loadVersions() {
  try {
    const raw = localStorage.getItem(VERSIONS_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}
function saveVersions(list) {
  localStorage.setItem(VERSIONS_KEY, JSON.stringify(list));
}
function setStatus(msg) { $status().textContent = msg || ''; }

// Find the index of the most recent snapshot for THIS tab (prefer the most recent overall)
function findLastSnapshotIndexForTab(list) {
  for (let i = list.length - 1; i >= 0; i--) {
    if (list[i].tabId === TAB_ID) return i;
  }
  return -1;
}

function updateDropdown() {
  const sel = $select();
  const versions = loadVersions();
  sel.innerHTML = '';
  if (!versions.length) {
    const opt = document.createElement('option');
    opt.textContent = 'No snapshots yet';
    sel.appendChild(opt);
    sel.disabled = true;
    setStatus('No snapshots yet.');
    return;
  }
  sel.disabled = false;
  versions.slice().sort((a,b) => b.id - a.id).forEach(v => {
    const opt = document.createElement('option');
    opt.value = String(v.id);
    opt.textContent = `${fmtDateMMDDYYYY(new Date(v.id))}: ${previewN(v.text)}`;
    sel.appendChild(opt);
  });
  setStatus(`Snapshots: ${versions.length}`);
}

/* =======================
   Autosave (one per tab)
   ======================= */
let inputDebounce = null;

function autosaveSnapshot() {
  const text = $text().value || '';
  const trimmed = text.replace(/\s+/g, ' ').trim();
  // Don't create/overwrite an autosave if the note is empty
  if (!trimmed) {
    localStorage.setItem(CURRENT_KEY, '');
    setStatus('Empty note — autosave skipped.');
    return;
  }

  const versions = loadVersions();
  const now = Date.now();
  const idx = findLastSnapshotIndexForTab(versions);

  try {
    if (idx >= 0) {
      // Overwrite this tab's last snapshot (keep a single autosave per tab)
      if (versions[idx].text !== text) {
        versions[idx].text = text;
        versions[idx].id = now; // refresh date to reflect latest edit
        saveVersions(versions);
        setStatus(`Updated autosave @ ${new Date().toLocaleTimeString()}`);
      } else {
        setStatus('No change since last autosave.');
      }
    } else {
      // First snapshot for this tab
      versions.push({ id: now, text, tabId: TAB_ID, kind: 'auto' });
      // Trim overall history if needed
      if (versions.length > MAX_VERSIONS) {
        versions.splice(0, versions.length - MAX_VERSIONS);
      }
      saveVersions(versions);
      setStatus(`Created autosave @ ${new Date().toLocaleTimeString()}`);
    }
    localStorage.setItem(CURRENT_KEY, text);
    updateDropdown();
  } catch (e) {
    if (e && (e.name === 'QuotaExceededError' || e.code === 22)) {
      alert('Storage is full. Please delete older snapshots or lower MAX_VERSIONS.');
      setStatus('Storage full; unable to save.');
    } else {
      console.warn('Autosave failed:', e);
      setStatus('Autosave failed. Check console for details.');
    }
  }
}

function handleInputDebounced() {
  try { localStorage.setItem(CURRENT_KEY, $text().value || ''); } catch {}
  if (inputDebounce) clearTimeout(inputDebounce);
  inputDebounce = setTimeout(autosaveSnapshot, AUTOSAVE_IDLE_MS);
}

/* ==========================
   Manual snapshot (permanent)
   ========================== */
function createManualSnapshot() {
  const text = $text().value || '';
  const trimmed = text.replace(/\s+/g, ' ').trim();
  if (!trimmed) {
    setStatus('Cannot save empty snapshot.');
    return;
  }

  const versions = loadVersions();
  const now = Date.now();
  try {
    versions.push({ id: now, text, tabId: TAB_ID, kind: 'manual' });
    if (versions.length > MAX_VERSIONS) {
      versions.splice(0, versions.length - MAX_VERSIONS);
    }
    saveVersions(versions);
    localStorage.setItem(CURRENT_KEY, text);
    updateDropdown();
    setStatus(`Saved manual snapshot @ ${new Date().toLocaleTimeString()}`);
  } catch (e) {
    if (e && (e.name === 'QuotaExceededError' || e.code === 22)) {
      alert('Storage is full. Please delete older snapshots or lower MAX_VERSIONS.');
      setStatus('Storage full; unable to save.');
    } else {
      console.warn('Manual snapshot failed:', e);
      setStatus('Snapshot failed. Check console for details.');
    }
  }
}

/* =================
   Restore + helpers
   ================= */
function restoreSelectedVersion() {
  const id = Number($select().value);
  if (!id) return;
  const versions = loadVersions();
  const v = versions.find(x => x.id === id);
  if (!v) return;
  $text().value = v.text;
  try { localStorage.setItem(CURRENT_KEY, v.text); } catch {}
  setStatus(`Restored snapshot from ${new Date(id).toLocaleString()}`);
}

function saveTextAsFile() {
  const textToSave = $text().value;
  const blob = new Blob([textToSave], {type:"text/plain"});
  const url = window.URL.createObjectURL(blob);
  const fileName = document.getElementById("inputFileNameToSaveAs").value || 'notes.txt';
  const link = document.createElement("a");
  link.download = fileName; link.href = url; link.style.display = "none";
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
}
function loadFileAsText() {
  const fileToLoad = document.getElementById("fileToLoad").files[0];
  if (!fileToLoad) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    $text().value = e.target.result;
    try { localStorage.setItem(CURRENT_KEY, e.target.result); } catch {}
    // After loading a file, also make it this tab's autosave immediately
    autosaveSnapshot();
  };
  reader.readAsText(fileToLoad, "UTF-8");
}
function previewHTML(){
  const text = $text().value;
  const w = window.open("","wildebeast","width=300,height=300,scrollbars=1,resizable=1");
  w.document.open(); w.document.write(text); w.document.close();
}

/* ========
   Bootstrap
   ======== */
document.addEventListener('DOMContentLoaded', function() {
  // Start blank as requested
  $text().value = '';
  updateDropdown();
  $text().focus();

  // Input handler -> debounced autosave (updates this tab's single autosave)
  $text().addEventListener('input', handleInputDebounced);

  // Persist current before unload (not a version, just working text)
  window.addEventListener('beforeunload', () => {
    try { localStorage.setItem(CURRENT_KEY, $text().value || ''); } catch {}
  });

  // Buttons
  document.getElementById('btnSaveFile').addEventListener('click', saveTextAsFile);
  document.getElementById('btnLoadFile').addEventListener('click', loadFileAsText);
  document.getElementById('btnPreview').addEventListener('click', previewHTML);
  document.getElementById('btnRestore').addEventListener('click', restoreSelectedVersion);
  document.getElementById('btnSnapshot').addEventListener('click', createManualSnapshot);

  // Spellcheck
  if (window.$Spelling && typeof $Spelling.SpellCheckAsYouType === 'function') {
    $Spelling.SpellCheckAsYouType('myTextArea');
  }
});
</script>
</body>
</html>
