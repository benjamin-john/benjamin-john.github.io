<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Text Editor</title>
  <link rel="icon" type="image/png" href="./newtab/icons/note.png">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script type="text/javascript" src="/JavaScriptSpellCheck/include.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: #0f2a50; font-family: sans-serif; }
    #myTextArea {
      background-color: #123563; color: white; font-size: 20px; width: 100%;
      flex: 1 1 auto; min-height: 220px; padding: 10px; box-sizing: border-box; border: none; outline: none;
    }
    table { width: 100%; background: #0f2a50; color: #e6eaf2; }
    td { vertical-align: middle; }
    input[type="text"], select {
      width: 100%; box-sizing: border-box; height: 2.14285714em; padding: 4px 10px; margin: 3px;
      border: 1px solid #2b3f66; border-radius: 3px; background: #0c2244; color: #e6eaf2;
    }
    button {
      width: 160px; box-sizing: border-box; transition: background-color .1s ease-out; border-radius: 3.01px;
      cursor: pointer; font-size: 14px; background-color: #E2E4E9; border: 1px solid transparent;
      color: #344563; text-decoration: none; display: inline-block; height: 2.14285714em; line-height: 1.42857143em;
      margin: 3px; padding: 4px 10px; white-space: nowrap;
    }
    button:hover { background-color: #D5D9E0; }
    .right { text-align: right; }
    .nowrap { white-space: nowrap; }
    #status { color: #9fb3d9; font-size: 12px; margin: 4px 8px 8px; min-height: 1em; }
  </style>
</head>

<body>
  <textarea name="myTextArea" id="myTextArea" placeholder="Start typing..."></textarea>

  <div id="status"></div>

  <table>
    <tr>
      <td class="nowrap">Filename to Save As:</td>
      <td><input id="inputFileNameToSaveAs" type="text" placeholder="notes.txt" /></td>
      <td class="right"><button id="btnSaveFile">Save Text to File</button></td>
    </tr>
    <tr>
      <td class="nowrap">Select a File to Load:</td>
      <td><input type="file" id="fileToLoad" /></td>
      <td class="right"><button id="btnLoadFile">Load Selected File</button></td>
    </tr>
    <tr>
      <td class="nowrap">Enter HTML Code to Preview:</td>
      <td></td>
      <td class="right"><button id="btnPreview">Preview HTML</button></td>
    </tr>
    <tr>
      <td class="nowrap">Snapshots (local):</td>
      <td>
        <select id="versionSelect" title="Choose a previous version to restore"></select>
      </td>
      <td class="right">
        <button id="btnRestore">Restore Selected</button>
        <button id="btnSnapshot">Save Snapshot</button>
      </td>
    </tr>
  </table>

<script>
/* =========================================
   Global version store + per-tab autosaving

   Text lives in IndexedDB, not localStorage. localStorage caps out around
   5 MB per site, and every snapshot holds a full copy of the note, so one
   large paste used to fill it and throw QuotaExceededError on every save.
   ========================================= */

// ---- Tab identity (persists across reloads in same tab) ----
function getTabId() {
  try {
    let id = sessionStorage.getItem('notepad.tabId');
    if (id) return id;
    id = (window.name && window.name.startsWith('notepad-'))
      ? window.name
      : `notepad-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
    sessionStorage.setItem('notepad.tabId', id);
    if (!window.name) window.name = id;
    return id;
  } catch {
    if (!window.name) window.name = `notepad-${Date.now()}-${Math.random().toString(36).slice(2,8)}`;
    return window.name;
  }
}
const TAB_ID = getTabId();

// ---- Legacy localStorage keys (migrated into IndexedDB on first load) ----
const CURRENT_KEY  = 'notepad.current';
const VERSIONS_KEY = 'notepad.versions';

// ---- Settings ----
const MAX_VERSIONS = 200;                    // total versions kept
const AUTOSAVE_IDLE_MS = 2000;               // 2s pause before autosave
const DROPDOWN_PREVIEW_LIMIT = 100;          // first 100 chars in dropdown

// ---- DOM helpers ----
const $text   = () => document.getElementById('myTextArea');
const $select = () => document.getElementById('versionSelect');
const $status = () => document.getElementById('status');

// ---- Utilities ----
function fmtDateMMDDYYYY(date) {
  const mm = String(date.getMonth() + 1).padStart(2, '0');
  const dd = String(date.getDate()).padStart(2, '0');
  const yyyy = date.getFullYear();
  return `${mm}/${dd}/${yyyy}`;
}
function previewN(txt, n = DROPDOWN_PREVIEW_LIMIT) {
  // Only look at the head of the text; collapsing whitespace across megabytes is wasted work
  const t = (txt || '').slice(0, n * 4).replace(/\s+/g, ' ').trim();
  return t.length <= n ? t : (t.slice(0, n) + '…');
}
function hasContent(text) { return /\S/.test(text || ''); }
function setStatus(msg) { $status().textContent = msg || ''; }
function isQuotaError(e) {
  return e && (e.name === 'QuotaExceededError' || e.code === 22 ||
               (e.inner && e.inner.name === 'QuotaExceededError'));
}

/* ==================
   IndexedDB storage
   ==================
   versions: { key, ts, text, tabId, kind }
     key is 'auto:<tabId>' for a tab's single autosave, 'manual:<ts>' for snapshots.
   kv: { key: 'current', text } for the last working text. */
let dbPromise = null;

function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    const req = indexedDB.open('notepad', 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      db.createObjectStore('versions', { keyPath: 'key' }).createIndex('ts', 'ts');
      db.createObjectStore('kv', { keyPath: 'key' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return dbPromise;
}

async function tx(stores, mode, work) {
  const db = await openDb();
  return new Promise((resolve, reject) => {
    const t = db.transaction(stores, mode);
    let result;
    Promise.resolve(work(t)).then(r => { result = r; });
    t.oncomplete = () => resolve(result);
    t.onerror = () => reject(t.error);
    t.onabort = () => reject(t.error || new DOMException('Transaction aborted', 'AbortError'));
  });
}

function reqToPromise(req) {
  return new Promise((resolve, reject) => {
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function loadVersions() {
  return tx(['versions'], 'readonly', t => reqToPromise(t.objectStore('versions').getAll()));
}

async function putVersion(v) {
  await tx(['versions'], 'readwrite', t => { t.objectStore('versions').put(v); });
  await pruneVersions();
}

// Keep the newest MAX_VERSIONS; walks the ts index oldest-first so texts are never loaded.
function pruneVersions(extra = 0) {
  return tx(['versions'], 'readwrite', t => {
    const store = t.objectStore('versions');
    store.count().onsuccess = e => {
      let toDelete = e.target.result - MAX_VERSIONS + extra;
      if (toDelete <= 0) return;
      store.index('ts').openKeyCursor().onsuccess = ev => {
        const cursor = ev.target.result;
        if (!cursor || toDelete <= 0) return;
        store.delete(cursor.primaryKey);
        toDelete--;
        cursor.continue();
      };
    };
  });
}

function saveCurrent(text) {
  return tx(['kv'], 'readwrite', t => { t.objectStore('kv').put({ key: 'current', text }); });
}

// Save, and if the disk quota is hit, drop the oldest snapshots and try once more.
async function withQuotaRetry(save) {
  try {
    await save();
  } catch (e) {
    if (!isQuotaError(e)) throw e;
    await pruneVersions(Math.ceil(MAX_VERSIONS / 4));
    await save();
  }
}

// One-time move of the old localStorage data into IndexedDB, then free that space.
async function migrateFromLocalStorage() {
  let raw;
  try { raw = localStorage.getItem(VERSIONS_KEY); } catch { return; }
  if (!raw) return;
  let list = [];
  try { list = JSON.parse(raw) || []; } catch {}
  await tx(['versions'], 'readwrite', t => {
    const store = t.objectStore('versions');
    list.forEach(v => {
      if (!v || typeof v.text !== 'string') return;
      const key = v.kind === 'auto' && v.tabId ? `auto:${v.tabId}` : `manual:${v.id}`;
      store.put({ key, ts: v.id, text: v.text, tabId: v.tabId, kind: v.kind || 'manual' });
    });
  });
  try {
    localStorage.removeItem(VERSIONS_KEY);
    localStorage.removeItem(CURRENT_KEY);
  } catch {}
}

async function updateDropdown() {
  const sel = $select();
  const versions = await loadVersions();
  sel.innerHTML = '';
  if (!versions.length) {
    const opt = document.createElement('option');
    opt.textContent = 'No snapshots yet';
    sel.appendChild(opt);
    sel.disabled = true;
    setStatus('No snapshots yet.');
    return;
  }
  sel.disabled = false;
  versions.sort((a,b) => b.ts - a.ts).forEach(v => {
    const opt = document.createElement('option');
    opt.value = v.key;
    opt.textContent = `${fmtDateMMDDYYYY(new Date(v.ts))}: ${previewN(v.text)}`;
    sel.appendChild(opt);
  });
}

function reportSaveError(e, what) {
  if (isQuotaError(e)) {
    setStatus('Disk storage for this site is full; unable to save. Use Save Text to File.');
  } else {
    console.warn(`${what} failed:`, e);
    setStatus(`${what} failed. Check console for details.`);
  }
}

/* =======================
   Autosave (one per tab)
   ======================= */
let inputDebounce = null;
let lastAutosaved = null;

async function autosaveSnapshot() {
  const text = $text().value || '';
  // Don't create/overwrite an autosave if the note is empty
  if (!hasContent(text)) {
    setStatus('Empty note — autosave skipped.');
    return;
  }
  if (text === lastAutosaved) {
    setStatus('No change since last autosave.');
    return;
  }

  try {
    await withQuotaRetry(async () => {
      await putVersion({ key: `auto:${TAB_ID}`, ts: Date.now(), text, tabId: TAB_ID, kind: 'auto' });
      await saveCurrent(text);
    });
    lastAutosaved = text;
    setStatus(`Autosaved @ ${new Date().toLocaleTimeString()} (${text.length.toLocaleString()} characters)`);
    await updateDropdown();
  } catch (e) {
    reportSaveError(e, 'Autosave');
  }
}

function handleInputDebounced() {
  if (inputDebounce) clearTimeout(inputDebounce);
  inputDebounce = setTimeout(autosaveSnapshot, AUTOSAVE_IDLE_MS);
}

/* ==========================
   Manual snapshot (permanent)
   ========================== */
async function createManualSnapshot() {
  const text = $text().value || '';
  if (!hasContent(text)) {
    setStatus('Cannot save empty snapshot.');
    return;
  }

  const now = Date.now();
  try {
    await withQuotaRetry(async () => {
      await putVersion({ key: `manual:${now}`, ts: now, text, tabId: TAB_ID, kind: 'manual' });
      await saveCurrent(text);
    });
    await updateDropdown();
    setStatus(`Saved manual snapshot @ ${new Date().toLocaleTimeString()}`);
  } catch (e) {
    reportSaveError(e, 'Snapshot');
  }
}

/* =================
   Restore + helpers
   ================= */
async function restoreSelectedVersion() {
  const key = $select().value;
  if (!key) return;
  const v = await tx(['versions'], 'readonly', t => reqToPromise(t.objectStore('versions').get(key)));
  if (!v) return;
  $text().value = v.text;
  setStatus(`Restored snapshot from ${new Date(v.ts).toLocaleString()}`);
  autosaveSnapshot();
}

function saveTextAsFile() {
  const textToSave = $text().value;
  const blob = new Blob([textToSave], {type:"text/plain"});
  const url = window.URL.createObjectURL(blob);
  const fileName = document.getElementById("inputFileNameToSaveAs").value || 'notes.txt';
  const link = document.createElement("a");
  link.download = fileName; link.href = url; link.style.display = "none";
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  setTimeout(() => window.URL.revokeObjectURL(url), 1000);
}
function loadFileAsText() {
  const fileToLoad = document.getElementById("fileToLoad").files[0];
  if (!fileToLoad) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    $text().value = e.target.result;
    // After loading a file, also make it this tab's autosave immediately
    autosaveSnapshot();
  };
  reader.readAsText(fileToLoad, "UTF-8");
}
function previewHTML(){
  const text = $text().value;
  const w = window.open("","wildebeast","width=300,height=300,scrollbars=1,resizable=1");
  w.document.open(); w.document.write(text); w.document.close();
}

/* ========
   Bootstrap
   ======== */
document.addEventListener('DOMContentLoaded', async function() {
  // Start blank as requested
  $text().value = '';
  $text().focus();

  // Input handler -> debounced autosave (updates this tab's single autosave)
  $text().addEventListener('input', handleInputDebounced);

  // Flush a pending autosave when the tab is hidden or closed
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && inputDebounce) {
      clearTimeout(inputDebounce);
      autosaveSnapshot();
    }
  });

  // Buttons
  document.getElementById('btnSaveFile').addEventListener('click', saveTextAsFile);
  document.getElementById('btnLoadFile').addEventListener('click', loadFileAsText);
  document.getElementById('btnPreview').addEventListener('click', previewHTML);
  document.getElementById('btnRestore').addEventListener('click', restoreSelectedVersion);
  document.getElementById('btnSnapshot').addEventListener('click', createManualSnapshot);

  // Spellcheck
  if (window.$Spelling && typeof $Spelling.SpellCheckAsYouType === 'function') {
    $Spelling.SpellCheckAsYouType('myTextArea');
  }

  // Ask the browser not to evict saved notes under storage pressure
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

  try {
    await migrateFromLocalStorage();
    await updateDropdown();
  } catch (e) {
    console.warn('Snapshot store unavailable:', e);
    setStatus('Snapshot storage unavailable in this browser; Save Text to File still works.');
  }
});
</script>
</body>
</html>
