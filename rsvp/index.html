<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Moved | RSVP</title>
<script>
  // This app moved to pebbly.dev. Links keep working: the event code and any host/organizer key
  // (everything after ?) go along unchanged. The first time, what this browser saved for the app
  // (host keys, your events, who you are) is carried over too, so nothing is lost.
  (function () {
    var target = 'https://pebbly.dev/rsvp/' + location.search, data = {}, n = 0;
    try {
      if (!localStorage.getItem('pebbly.moved.rsvp')) {
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k.indexOf('rsvp.') === 0 && !/\.local\.db$/.test(k)) { data[k] = localStorage.getItem(k); n++; }
        }
        localStorage.setItem('pebbly.moved.rsvp', '1');
      }
    } catch (e) {}
    if (n) target += '#pebbly-import=' + encodeURIComponent(btoa(unescape(encodeURIComponent(JSON.stringify(data)))));
    else target += location.hash;
    location.replace(target);
  })();
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://pebbly.dev/rsvp/"></noscript>
</head>
<body style="font-family:system-ui,sans-serif;padding:24px">
<p>This page has moved to <a id="go" href="https://pebbly.dev/rsvp/">pebbly.dev/rsvp</a>.</p>
<script>document.getElementById('go').href = 'https://pebbly.dev/rsvp/' + location.search;</script>
</body>
</html>
