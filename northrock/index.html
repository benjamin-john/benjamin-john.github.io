<html lang="en">

  <title>New Tab</title>

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
:root {
  --cream: #EEEDE6;
  --sand: #D5CDB9;
  --tan: #BAAE8D;
  --gold: #A48751;
  --navy: #213751;
  --ink: #000D1D;

  --bg: var(--cream);
  --card: #FFFFFF;
  --text: var(--navy);
  --muted: #6B7280;
  --border: #DEDACB;
  --watermark: var(--sand);
  --logo: var(--navy);
}


* { box-sizing: border-box; }

html, body { margin: 0; min-height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: Montserrat, "Helvetica Neue", Arial, sans-serif;
  overflow-x: hidden;
}

.watermark {
  position: fixed;
  right: -6vw;
  bottom: -8vh;
  height: 92vh;
  fill: var(--watermark);
  opacity: .55;
  pointer-events: none;
  z-index: 0;
}

main {
  position: relative;
  z-index: 1;
  max-width: 980px;
  margin: 0 auto;
  padding: 9vh 16px 48px;
}

header { text-align: center; margin-bottom: 36px; }

.wordmark { width: min(340px, 80vw); height: auto; fill: var(--logo); }


/* Search */

.search { text-align: center; }

#searchBox {
  width: 100%;
  max-width: 680px;
  height: 52px;
  padding: 0 20px;
  font: 500 17px Montserrat, sans-serif;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 26px;
  outline: none;
  box-shadow: 0 1px 2px rgba(0, 13, 29, .04);
  transition: border-color .15s, box-shadow .15s;
}

#searchBox:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 4px rgba(164, 135, 81, .15);
}

#searchBox.is-id { border-color: var(--navy); }

.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin-top: 18px;
}

.buttons button {
  min-width: 128px;
  height: 38px;
  padding: 0 18px;
  font: 600 13px Montserrat, sans-serif;
  letter-spacing: .03em;
  color: var(--navy);
  background: transparent;
  border: 1.5px solid var(--navy);
  border-radius: 19px;
  cursor: pointer;
  transition: background .15s, color .15s, transform .15s;
}

.buttons button:hover { background: var(--navy); color: var(--cream); transform: translateY(-1px); }
.buttons button.primary { background: var(--navy); color: var(--cream); }
.buttons button.primary:hover { background: var(--ink); }
.buttons button.sandbox { border-color: var(--gold); color: var(--gold); }
.buttons button.sandbox:hover { background: var(--gold); color: #fff; }


.hint {
  margin: 14px 0 0;
  min-height: 1.2em;
  font-size: 12px;
  color: var(--muted);
}

.hint strong { color: var(--gold); font-weight: 600; }

/* Bookmarks */

.bookmarks {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
  grid-auto-rows: 1fr;
  gap: 14px;
  margin-top: 52px;
}

.tile { position: relative; }

.tile > a {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
  height: 100%;
  padding: 18px 8px 14px;
  color: var(--text);
  text-decoration: none;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}

.tile > a:hover,
.tile:focus-within > a {
  transform: translateY(-2px);
  border-color: var(--tan);
  box-shadow: 0 8px 20px rgba(0, 13, 29, .08);
}

.icon {
  position: relative;
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
}

.icon img { width: 32px; height: 32px; border-radius: 6px; }

.icon.local { background: var(--navy); border-radius: 10px; }
.icon.local img { width: 26px; height: 26px; }

.icon .letter {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--navy);
  color: var(--cream);
  font-weight: 800;
  font-size: 18px;
}

.badge {
  position: absolute;
  right: -10px;
  bottom: -4px;
  padding: 1px 5px;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .05em;
  color: #fff;
  background: var(--gold);
  border-radius: 6px;
}

.label {
  font-size: 12px;
  font-weight: 600;
  text-align: center;
  line-height: 1.25;
}

/* Hover menu for tiles with sub-links */

.menu {
  display: none;
  position: absolute;
  top: calc(100% - 6px);
  left: 50%;
  transform: translateX(-50%);
  min-width: 180px;
  padding: 6px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 12px 28px rgba(0, 13, 29, .14);
  z-index: 5;
}

.tile:hover .menu,
.tile:focus-within .menu { display: block; }

.menu a {
  display: block;
  padding: 8px 10px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  text-decoration: none;
  border-radius: 6px;
}

.menu a:hover { background: var(--bg); color: var(--gold); }

@media (max-width: 520px) {
  main { padding-top: 6vh; }
  .bookmarks { grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
  .buttons button { min-width: 0; flex: 1 1 40%; }
}
</style>
</head>

    </header>

    <section class="search">
      <input id="searchBox" type="text" autocomplete="off" spellcheck="false"
             placeholder="Search, or paste a Salesforce Id or URL" autofocus>
      <div class="buttons">
        <button data-engine="google" class="primary">Google</button>
        <button data-engine="prod">Salesforce</button>
        <button data-engine="fullsb" class="sandbox">Full Sandbox</button>
        <button data-engine="claude">Claude</button>
      </div>
      <p id="hint" class="hint">Enter: Google &middot; Shift+Enter: Salesforce &middot; Option+Enter: Full Sandbox</p>
    </section>

    <nav id="bookmarks" class="bookmarks"></nav>
  </main>

  <script>
/* ==========================
   Orgs, bookmarks, engines
   ========================== */

const ORGS = {
  prod:   'https://nrp.lightning.force.com',
  fullsb: 'https://nrp--fullsb.sandbox.lightning.force.com',
};

function orgMenu(base) {
  return [
    ['Setup',               base + '/lightning/setup/SetupOneHome/home'],
    ['Object Manager',      base + '/lightning/setup/ObjectManager/home'],
    ['Flows',               base + '/lightning/setup/Flows/home'],
    ['Deployment Status',   base + '/lightning/setup/DeployStatus/home'],
    ['Developer Console',   base + '/_ui/common/apex/debug/ApexCSIPage'],
  ];
}

// icon: image under icons/. iconBg: sit a light icon on a navy square. badge: small corner tag.
const BOOKMARKS = [
  { name: 'Salesforce Prod',         url: ORGS.prod + '/lightning/page/home',   icon: 'icons/salesforce.png', menu: orgMenu(ORGS.prod) },
  { name: 'Full Sandbox',            url: ORGS.fullsb + '/lightning/page/home', icon: 'icons/salesforce.png', badge: 'SB', menu: orgMenu(ORGS.fullsb) },
  { name: 'Zoom Docs',     url: 'https://docs.zoom.us/',                 icon: 'icons/zoom.png' },
  { name: 'Outlook',       url: 'https://outlook.office.com/mail/',      icon: 'icons/outlook.png' },
  { name: 'SharePoint',    url: 'https://northrockpartners.sharepoint.com/', icon: 'icons/sharepoint.png' },
  { name: 'Asana',         url: 'https://app.asana.com/',                icon: 'icons/asana.png' },
  { name: 'GitHub',        url: 'https://github.com/NorthRock-Partners/edge',icon: 'icons/github.png' },
  { name: 'Text Edit',     url: 'https://benjamin-john.com/text.html',   icon: 'icons/note.png', iconBg: true },
  { name: 'UKG',           url: 'https://secure6.saashr.com/ta/6186483.login', icon: 'icons/ukg.png' },
  { name: 'Lattice',       url: 'https://northrock.latticehq.com/',      icon: 'icons/lattice.png' },
  { name: 'Black Diamond', url: 'https://login.bdreporting.com/Auth/SignIn',icon: 'icons/blackdiamond.png' },
  { name: 'DocuSign',      url: 'https://app.docusign.com/',             icon: 'icons/docusign.png' },
  { name: 'Formstack',     url: 'https://www.formstack.com/admin',       icon: 'icons/formstack.png' },
  { name: 'ComplianceAlpha', url: 'https://www.compliancealpha.com/',    icon: 'icons/compliancealpha.png' },
  { name: 'MuleSoft',      url: 'https://anypoint.mulesoft.com/',        icon: 'icons/mulesoft.png' },
  { name: 'Own',           url: 'https://app.owndata.com/',              icon: 'icons/own.jpg' },
  { name: '1Password',     url: 'https://my.1password.com/',             icon: 'icons/1password.png' },
];

/* ==========
   Rendering
   ========== */

function iconFor(b) {
  const wrap = document.createElement('span');
  wrap.className = 'icon';

  const img = document.createElement('img');
  img.alt = '';
  img.src = b.icon;
  img.onerror = () => {
    const letter = document.createElement('span');
    letter.className = 'letter';
    letter.textContent = b.name.charAt(0);
    img.replaceWith(letter);
  };
  if (b.iconBg) wrap.classList.add('local');
  wrap.appendChild(img);

  if (b.badge) {
    const badge = document.createElement('span');
    badge.className = 'badge';
    badge.textContent = b.badge;
    wrap.appendChild(badge);
  }
  return wrap;
}

function renderBookmarks() {
  const nav = document.getElementById('bookmarks');
  BOOKMARKS.forEach(b => {
    const tile = document.createElement('div');
    tile.className = 'tile';

    const a = document.createElement('a');
    a.href = b.url;
    a.title = b.name;
    a.appendChild(iconFor(b));
    const label = document.createElement('span');
    label.className = 'label';
    label.textContent = b.name;
    a.appendChild(label);
    tile.appendChild(a);

    if (b.menu) {
      const menu = document.createElement('div');
      menu.className = 'menu';
      b.menu.forEach(([text, href]) => {
        const link = document.createElement('a');
        link.href = href;
        link.textContent = text;
        menu.appendChild(link);
      });
      tile.appendChild(menu);
    }
    nav.appendChild(tile);
  });
}

/* ===========
   Searching
   =========== */

const $box  = () => document.getElementById('searchBox');
const $hint = () => document.getElementById('hint');
const DEFAULT_HINT = $hint().innerHTML;

// A bare 15/18 character Id, or one pulled out of a pasted Salesforce URL
// (Lightning /lightning/r/Object/Id/view, /lightning/r/Id/view, or Classic /Id).
function findRecordId(text) {
  const t = text.trim();
  const fromUrl = t.match(/force\.com\/(?:lightning\/r\/(?:\w+\/)?)?([a-zA-Z0-9]{15}(?:[a-zA-Z0-9]{3})?)(?=[\/?#]|$)/);
  if (fromUrl) return fromUrl[1];
  if (/^[a-zA-Z0-9]{15}(?:[a-zA-Z0-9]{3})?$/.test(t) && /\d/.test(t)) return t;
  return null;
}

function salesforceUrl(org, text) {
  const base = ORGS[org];
  const id = findRecordId(text);
  if (id) return base + '/lightning/r/' + id + '/view';
  if (!text.trim()) return base + '/lightning/page/home';

  const term = text.trim();
  const search = {
    componentDef: 'forceSearch:search',
    attributes: {
      term: term,
      scopeMap: { type: 'TOP_RESULTS' },
      context: { disableSpellCorrection: false, SEARCH_ACTIVITY: { term: term } },
    },
  };
  const encoded = btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(search))));
  return base + '/one/one.app#' + encoded;
}

function googleUrl(text) {
  const t = text.trim();
  if (/^https?:\/\/\S+$/i.test(t)) return t;
  if (/^[\w-]+(\.[\w-]+)*\.[a-z]{2,}(:\d+)?(\/\S*)?$/i.test(t)) return 'https://' + t;
  return 'https://www.google.com/search?q=' + encodeURIComponent(t);
}

function claudeUrl(text) {
  const t = text.trim();
  return t ? 'https://claude.ai/new?q=' + encodeURIComponent(t) : 'https://claude.ai/new';
}

function urlFor(engine, text) {
  switch (engine) {
    case 'prod':
    case 'fullsb': return salesforceUrl(engine, text);
    case 'claude': return claudeUrl(text);
    default:       return googleUrl(text);
  }
}

function go(url, newTab) {
  if (newTab) window.open(url, '_blank');
  else window.location.href = url;
}

// Arithmetic only (digits and operators), so nothing else is ever evaluated.
function tryCalc(text) {
  const t = text.trim();
  if (!/^[\d\s.+\-*/()%^]+$/.test(t) || !/\d\s*[+\-*/%^]\s*[\d(]/.test(t)) return false;
  try {
    const result = Function('"use strict"; return (' + t.replace(/\^/g, '**') + ')')();
    if (typeof result !== 'number' || !isFinite(result)) return false;
    $box().value = String(Math.round(result * 1e10) / 1e10);
    $box().select();
    return true;
  } catch {
    return false;
  }
}

function updateHint() {
  const id = findRecordId($box().value);
  $box().classList.toggle('is-id', !!id);
  $hint().innerHTML = id
    ? '<strong>Salesforce Id ' + id + '</strong> &middot; Enter opens it in Prod, Option+Enter in Full Sandbox'
    : DEFAULT_HINT;
}

/* ========
   Wiring
   ======== */

renderBookmarks();

document.querySelectorAll('.buttons button').forEach(btn => {
  btn.addEventListener('click', e => {
    go(urlFor(btn.dataset.engine, $box().value), e.metaKey || e.ctrlKey);
  });
});

$box().addEventListener('input', updateHint);

$box().addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  const text = $box().value;
  const newTab = e.metaKey || e.ctrlKey;

  if (e.altKey)   return go(urlFor('fullsb', text), newTab);
  if (e.shiftKey) return go(urlFor('prod', text), newTab);
  if (findRecordId(text)) return go(urlFor('prod', text), newTab);
  if (tryCalc(text)) return;
  go(urlFor('google', text), newTab);
});

// Typing anywhere on the page lands in the search box.
document.addEventListener('keydown', e => {
  if (document.activeElement === $box() || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key.length === 1) $box().focus();
});

window.addEventListener('pageshow', () => { $box().focus(); updateHint(); });

// Serve the page, icons and font from a local cache so a new tab never waits on the network.
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
